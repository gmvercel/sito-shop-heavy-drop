<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrello - Heavy Drop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <img src="assets/logo.svg" alt="Heavy Drop" class="logo-img">
            </div>
            <button class="hamburger-menu" onclick="toggleMobileMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav-primary" id="mobileMenu">
                <a href="index.html" class="nav-link" onclick="closeMobileMenu()">Home</a>
                <a href="product.html" class="nav-link" onclick="closeMobileMenu()">Prodotti</a>
                <a href="cart.html" class="nav-link active" onclick="closeMobileMenu()">🛒 Carrello <span class="cart-count">0</span></a>
            </nav>
        </div>
    </header>

    <main>
        <!-- CART SECTION -->
        <section class="cart-container">
            <h2>Il tuo Carrello</h2>
            
            <div class="cart-content" id="cartContent">
                <!-- Il contenuto del carrello viene generato da JavaScript -->
            </div>

            <div class="cart-summary" id="cartSummary" style="display: none;">
                <div class="summary-box">
                    <h3>Riepilogo Ordine</h3>
                    <div class="summary-row">
                        <span>Subtotale:</span>
                        <span id="subtotal">€0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Spedizione:</span>
                        <span id="shipping">€5.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Totale:</span>
                        <span id="total">€5.00</span>
                    </div>
                    <button class="btn-checkout" onclick="startCheckout()">PROCEDI AL PAGAMENTO</button>
                    <a href="product.html" class="btn-continue">Continua lo Shopping</a>
                </div>
            </div>

            <div class="empty-cart" id="emptyCart">
                <p>Il tuo carrello è vuoto</p>
                <a href="index.html" class="btn-primary">Torna allo shop</a>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>&copy; 2026 Heavy Drop Shop. Tutti i diritti riservati (G.M. Programmatore).</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
